<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080b1d">
<title>AMBIKA PANE AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100%;background:#080b1d;color:#fff;font-family:Arial,sans-serif}
body{overflow-x:hidden;background:radial-gradient(circle at 50% -10%,#35408a 0,#151a48 22%,transparent 55%),linear-gradient(180deg,#0d1230 0%,#080b1d 55%,#040611 100%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.14;background-image:linear-gradient(#7b7cff18 1px,transparent 1px),linear-gradient(90deg,#7b7cff18 1px,transparent 1px);background-size:38px 38px;z-index:0}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 30%,transparent 35%,#00131955 100%);z-index:0}
button{font:inherit}

#loadingScreen{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,#073c44 0,#020e13 52%,#010609 100%);transition:opacity .65s,visibility .65s}
#loadingScreen.hide{opacity:0;visibility:hidden}
.loader{text-align:center;width:100%;max-width:410px;padding:28px}
.loaderPhotoBox{width:150px;height:150px;margin:auto;display:flex;align-items:center;justify-content:center;position:relative}
.loaderPhotoBox:before,.loaderPhotoBox:after{content:"";position:absolute;border-radius:50%;border:2px solid transparent}
.loaderPhotoBox:before{width:173px;height:173px;border-top-color:#64e8ff;border-right-color:#7b5cff;animation:spin 2s linear infinite}
.loaderPhotoBox:after{width:202px;height:202px;border-left-color:#64e8ff;border-bottom-color:#7b5cff;animation:spinr 4s linear infinite}
.loaderPhoto{width:124px;height:124px;border-radius:24px;object-fit:cover;border:3px solid #64e8ff;position:relative;z-index:2;box-shadow:0 0 18px #64e8ff,0 0 55px #00dfff66;animation:pulse 1.5s infinite}
.loaderTitle{margin-top:31px;font-size:25px;font-weight:900;letter-spacing:2px}
.loaderSub{margin-top:8px;color:#7da3ad;font-size:11px;letter-spacing:3px}
.progressArea{margin-top:30px}
.progressInfo{display:flex;justify-content:space-between;color:#78969f;font-size:11px;margin-bottom:8px}
.progressInfo #percent{color:#64e8ff;font-weight:900}
.progress{height:8px;border-radius:20px;background:#071c22;border:1px solid #10404a;overflow:hidden}
.progressBar{width:0;height:100%;background:linear-gradient(90deg,#7b5cff,#64e8ff);box-shadow:0 0 16px #64e8ff;border-radius:20px}
.loadingStatus{margin-top:13px;color:#66828b;font-size:10px;letter-spacing:1px}
#app{display:none;position:relative;z-index:1;min-height:100vh}

.container{width:100%;max-width:694px;margin:0 auto;padding:35px 28px 118px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;padding-bottom:4px}
.brand{display:flex;align-items:center;gap:21px;min-width:0}
.brandPhoto{width:82px;height:82px;flex:0 0 82px;object-fit:cover;border-radius:25px;border:3px solid #64e8ff;box-shadow:0 0 18px #45d7ff55,0 0 45px #7b5cff25;background:#080d22}
.brandText{min-width:0}
.brandText h1{font-size:34px;line-height:1;font-weight:900;letter-spacing:1.2px;white-space:nowrap}
.brandText h1 span{color:#64e8ff}
.brandText p{margin-top:13px;color:#849da4;font-size:16px;letter-spacing:2px;font-weight:800;white-space:nowrap}
.aiBars{color:#64e8ff;font-size:18px;letter-spacing:-2px;margin-left:8px}
.soundBtn{width:68px;height:68px;flex:0 0 68px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:29px;background:#111735cc;border:1px solid #5f7dff20;box-shadow:inset 0 0 20px #5f7dff08}

.statusRow{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;margin-bottom:34px}
.status{height:52px;border-radius:28px;border:1px solid #4bd9ff42;background:#0d1433dd;display:flex;align-items:center;justify-content:center;gap:11px;color:#9bc3ca;font-size:14px;font-weight:800;letter-spacing:1.5px;white-space:nowrap;box-shadow:0 12px 35px #0005,inset 0 0 24px #7b7cff0a}
.status strong{color:#64e8ff}
.greenDot,.blueDot{width:13px;height:13px;border-radius:50%;display:inline-block}
.greenDot{background:#57f2b0;box-shadow:0 0 14px #57f2b0}
.blueDot{background:#45d7ff;box-shadow:0 0 14px #45d7ff}

.statsBox{height:86px;border-radius:30px;display:grid;grid-template-columns:1fr 1fr;align-items:center;position:relative;padding:0 23px;background:linear-gradient(90deg,#536cff33,#7b5cff2c);border:1px solid #5f7dff61;margin-bottom:31px;box-shadow:0 12px 35px #0005,inset 0 0 24px #7b7cff0a}
.statLine{display:flex;align-items:center;gap:9px;min-width:0}
.statLine:first-child{border-right:1px solid #5f7dff35;padding-right:15px}
.statLine:nth-child(2){padding-left:15px}
.statLabel{color:#91bbc3;font-size:11px;font-weight:900;letter-spacing:1.2px;white-space:nowrap}
.statLine strong{color:#64e8ff;font-size:18px;font-weight:900;font-family:monospace;letter-spacing:.3px;white-space:nowrap}
.demoTag{position:absolute;right:17px;bottom:7px;color:#6f969f;font-size:7px;letter-spacing:1.2px}

.accuracy{height:68px;border-radius:36px;display:flex;align-items:center;padding:0 25px;gap:17px;background:linear-gradient(90deg,#536cff33,#7b5cff2c);border:1px solid #5f7dff61;margin-bottom:31px;box-shadow:0 12px 35px #0005,inset 0 0 24px #7b7cff0a}

.targetCard{border:2px solid #7b7cff66;border-radius:44px;padding:31px 29px 28px;background:radial-gradient(circle at 83% 38%,#45d7ff12,transparent 28%),linear-gradient(135deg,#151b45b0,#12183ebd);box-shadow:0 18px 45px #0006,inset 0 0 40px #7b7cff10;margin-bottom:30px}
.targetTitle{display:flex;align-items:center;gap:12px;color:#00cce5;font-size:16px;font-weight:900;letter-spacing:2.1px}
.flag{width:29px;height:9px;background:linear-gradient(90deg,#ff4fc8,#7b5cff);display:inline-block}

.periodRow{display:grid;grid-template-columns:minmax(0,1fr) 103px;align-items:center;margin-top:22px;gap:14px}
.periodWrap{min-width:0;overflow:hidden;padding-right:4px}
#period{font-size:clamp(14px,4.1vw,21px);font-weight:900;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:clip;display:block;width:100%;max-width:100%;letter-spacing:-.4px}

.timer{width:103px;height:103px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:6px solid #64e8ff;border-left-color:#7b5cff;border-bottom-color:#45d7ff;box-shadow:0 0 24px #45d7ff3d,inset 0 0 20px #45d7ff12;position:relative}
.timer:before{content:"";position:absolute;inset:-9px;border-radius:50%;border:1px solid #45d7ff12}
.timer div{font-size:26px;font-weight:900;font-family:monospace}
.timer small{color:#7da0a9;font-size:10px;letter-spacing:2px;margin-top:5px}

.actionRow{display:flex;gap:16px;margin-top:21px}
.actionBtn{height:52px;border-radius:27px;border:1px solid #4bd9ff4c;padding:0 24px;background:#0b1230cc;color:#a2cbd2;font-size:15px;font-weight:900}
.activeBtn i{display:inline-block;width:10px;height:10px;background:#57f2b0;border-radius:50%;box-shadow:0 0 11px #57f2b0;margin-right:9px}

.patternBox{margin-top:28px;border:2px solid #7b7cff;border-radius:25px;padding:23px 20px 19px;background:#080d20f2;box-shadow:inset 0 0 24px #45d7ff05}
.patternTop{display:flex;justify-content:space-between;gap:15px;color:#c2d3d7;font-size:15px;font-weight:900;line-height:1.7}
.patternValue{color:#64e8ff;font-size:17px}
.patternBar{height:17px;margin-top:12px;border-radius:20px;padding:2px;background:#10262c;border:1px solid #007d8a;overflow:hidden}
.patternFill{width:60%;height:100%;border-radius:20px;background:linear-gradient(90deg,#ffd75a 0 40%,#64e8ff 40%);box-shadow:0 0 10px #64e8ffaa}

.lockCard{min-height:335px;border-radius:22px;border:2px solid #5f7dff67;background:radial-gradient(circle at 50% 22%,#45d7ff16,transparent 33%),linear-gradient(135deg,#11183f,#0a102b);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 28px;box-shadow:0 18px 50px #0007,inset 0 0 55px #7b5cff10;margin-bottom:28px}
.lockCard.uidActive{min-height:250px}
.lockCircle{width:104px;height:104px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;border:3px solid #45d7ff;box-shadow:0 0 23px #45d7ff66,inset 0 0 25px #45d7ff1a}
.lockCircle:before{content:"";position:absolute;inset:-14px;border:3px dashed #7b7cff;border-radius:50%;animation:spin 7s linear infinite}
.lockCircle:after{content:"";position:absolute;inset:-22px;border:2px dotted #45d7ff59;border-radius:50%;animation:spinr 10s linear infinite}
.lockIcon{font-size:43px;filter:drop-shadow(0 0 10px #64e8ff)}
.lockCard h2{margin-top:22px;font-size:34px;font-weight:900;letter-spacing:1px}
.lockCard p{margin-top:9px;max-width:520px;color:#86aeb7;font-size:18px;line-height:1.55}
.unlockBtn{width:100%;max-width:550px;height:54px;margin-top:18px;border:0;border-radius:36px;background:linear-gradient(100deg,#57f2b0,#45d7ff 55%,#7b5cff);color:#02151c;font-size:20px;font-weight:900;letter-spacing:1px;box-shadow:0 12px 32px #45d7ff24;cursor:pointer}

.predictionActive{display:none;margin-top:17px;width:100%;padding:16px;border-radius:18px;border:1px solid #57f2b055;background:#071d23;box-shadow:0 0 28px #57f2b014}
.predictionActive.show{display:block;animation:resultIn .35s ease both}
.predictionLabel{font-size:9px;color:#57f2b0;letter-spacing:1.5px;font-weight:1000}
.predictionNumber{margin-top:8px;font-size:45px;font-weight:1000;color:#64e8ff;text-shadow:0 0 18px #45d7ff55}
.predictionMeta{font-size:10px;color:#86aeb7;margin-top:5px}

.uidSuccess{display:none;width:100%;margin-top:15px;padding:16px;border-radius:17px;border:1px solid #57f2b055;background:#071d23;color:#57f2b0;font-size:14px;font-weight:1000;letter-spacing:.7px}
.uidSuccess.show{display:block;animation:resultIn .35s ease both}
.uidSuccess small{display:block;color:#8fb5bc;margin-top:7px;font-size:10px;letter-spacing:.4px}

.resultSection{margin-top:24px;padding-top:5px}
.resultHeader{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.resultHeader h2{font-size:19px;letter-spacing:1px}
.liveBadge{color:#57f2b0;border:1px solid #57f2b040;padding:7px 13px;border-radius:20px;font-size:10px;font-weight:900}
.resultList{display:flex;flex-direction:column;gap:9px}
.resultRow{min-height:68px;display:grid;grid-template-columns:minmax(0,1fr) 54px 68px 70px;align-items:center;gap:8px;padding:9px 12px;border-radius:16px;border:1px solid #45d7ff28;background:linear-gradient(100deg,#0c1535,#080f29);box-shadow:0 8px 25px #0004,inset 0 0 22px #7b5cff07}
.resultIssue{color:#7fa4ad;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resultNumber{text-align:center;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#080d20;border:1px solid #5f7dff25;overflow:hidden;justify-self:center}
.resultNumber img{width:40px;height:40px;object-fit:contain;display:block}
.resultNumberFallback{color:#64e8ff;font-size:22px;font-weight:1000}
.resultSize{min-width:54px;text-align:center;font-size:9px;font-weight:1000;padding:7px 5px;border-radius:10px;background:#0b1430;border:1px solid #45d7ff22}
.resultBig{color:#ffd75a}
.resultSmall{color:#64e8ff}
.resultStatus{min-width:62px;text-align:center;font-size:9px;font-weight:1000;letter-spacing:1px;padding:8px 5px;border-radius:16px;border:1px solid #45d7ff45;color:#64e8ff;background:#0b1834}
.resultStatus.loss{color:#ff4fc8;border-color:#ff4fc855;background:#21112b}
.resultLoading,.resultError{text-align:center;padding:30px 10px;color:#71839e;font-size:11px;line-height:1.7}
.demoNote{font-size:8px;color:#71839e;margin:0 0 10px;letter-spacing:.5px}

.unlockOverlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;background:#000b0fbb;backdrop-filter:blur(9px);opacity:0;visibility:hidden;transition:.3s}
.unlockOverlay.show{opacity:1;visibility:visible}
.unlockModal{width:100%;max-width:430px;position:relative;border:1px solid #5f7dff55;border-radius:27px;padding:27px 23px 20px;background:radial-gradient(circle at 50% -10%,#35408a66,transparent 42%),linear-gradient(180deg,#10183def,#070b1bf7);box-shadow:0 0 55px #7b5cff25,0 25px 90px #000d;transform:translateY(15px) scale(.97);transition:.3s}
.unlockOverlay.show .unlockModal{transform:translateY(0) scale(1)}
.modalClose{position:absolute;top:13px;right:14px;width:33px;height:33px;border-radius:50%;border:1px solid #5f7dff2b;background:#080d22;color:#8caeb5;font-size:22px;line-height:1;cursor:pointer}
.modalLock{width:58px;height:58px;margin:3px auto 16px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#45d7ff24,#080d20);border:1px solid #5f7dff58;box-shadow:0 0 25px #45d7ff15}
.modalLock span{font-size:27px;color:#64e8ff;filter:drop-shadow(0 0 8px #64e8ff)}
.modalTitle{text-align:center;color:#dff7fa;font-size:17px;font-weight:1000;letter-spacing:1.2px}
.modalTitle span{color:#64e8ff}
.modalSub{text-align:center;margin-top:8px;color:#75969e;font-size:10px;letter-spacing:.3px}
.accessBox{margin-top:19px;border:1px solid #5f7dff30;border-radius:15px;padding:11px;background:#080d20}
.accessTop{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#8bb4bb;font-size:9px;font-weight:900;letter-spacing:.6px}
.signal{color:#57f2b0}
.registerBtn{width:100%;height:54px;margin-top:13px;border:1px solid #ffd75a55;border-radius:18px;background:linear-gradient(135deg,#19152a,#241d36);color:#ffd75a;font-size:17px;font-weight:900;letter-spacing:1px;cursor:pointer}
.uidLabel{display:flex;justify-content:space-between;margin-top:18px;margin-bottom:7px;color:#73949b;font-size:8px;font-weight:900;letter-spacing:1px}
.uidLabel span:last-child{color:#64e8ff}
.uidInput{width:100%;height:52px;padding:0 14px;border-radius:13px;outline:none;border:1px solid #5f7dff38;background:#070b1b;color:#e8fbfd;font-size:14px;font-weight:800;letter-spacing:1px;font-family:monospace;transition:.2s}
.uidInput::placeholder{color:#476970}
.uidInput:focus{border-color:#64e8ff;box-shadow:0 0 16px #45d7ff15}
.verifyBtn{width:100%;height:62px;margin-top:22px;border:0;border-radius:32px;background:linear-gradient(100deg,#64e8ff,#7b5cff);color:#02151c;font-size:18px;font-weight:900;letter-spacing:1px;cursor:pointer;box-shadow:0 10px 30px #00aaff38}
.modalDivider{height:1px;background:#5f7dff44;margin:25px 0 15px}
.telegramBtn{width:100%;height:54px;border-radius:18px;border:1px solid #5f7dff44;background:#101d45;color:#64e8ff;font-size:16px;font-weight:900;cursor:pointer}
.securityRow{display:flex;justify-content:space-between;margin-top:24px;color:#66838b;font-size:11px;letter-spacing:1px}
.securityRow span{color:#57f2b0}

.adminLaunch{display:none;width:100%;height:48px;margin:-10px 0 22px;border-radius:16px;border:1px solid #45d7ff55;background:#0b1535;color:#64e8ff;font-size:12px;font-weight:1000;letter-spacing:1px;cursor:pointer}
.adminOverlay{position:fixed;inset:0;z-index:11000;display:none;align-items:center;justify-content:center;padding:14px;background:#000c;backdrop-filter:blur(10px)}
.adminOverlay.show{display:flex}
.adminPanel{width:100%;max-width:520px;max-height:92vh;overflow:auto;border:1px solid #5f7dff55;border-radius:24px;background:linear-gradient(180deg,#10183f,#070b1b);box-shadow:0 30px 90px #000d;padding:22px}
.adminHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.adminHead h2{font-size:20px;color:#64e8ff}
.adminClose{width:38px;height:38px;border-radius:50%;border:1px solid #5f7dff44;background:#080d20;color:#fff;font-size:22px}
.adminLogin,.adminControls{display:grid;gap:10px}
.adminInput,.adminSelect{width:100%;height:48px;border-radius:13px;border:1px solid #5f7dff44;background:#060a19;color:#fff;padding:0 13px;outline:none}
.adminBtn{height:48px;border:0;border-radius:14px;background:linear-gradient(100deg,#64e8ff,#7b5cff);color:#04131b;font-weight:1000;cursor:pointer}
.adminBtn.red{background:linear-gradient(100deg,#ff4f9a,#ff315d);color:#fff}
.adminInfo{font-size:10px;color:#7697a0;line-height:1.5}
.adminList{margin-top:16px;display:grid;gap:9px}
.adminItem{border:1px solid #45d7ff25;background:#080f29;border-radius:14px;padding:12px}
.adminItemTop{display:flex;justify-content:space-between;gap:8px;color:#d8f8fc;font-size:12px;font-weight:900}
.adminItemSub{margin-top:6px;color:#7899a2;font-size:9px;line-height:1.6}
.adminItemActions{display:flex;gap:7px;margin-top:9px}
.adminItemActions button{flex:1;height:34px;border-radius:9px;border:1px solid #45d7ff35;background:#0c1838;color:#64e8ff;font-size:9px;font-weight:900}
.accessActive{color:#57f2b0!important}

.bottomNav{position:fixed;z-index:500;bottom:20px;left:28px;right:28px;height:92px;max-width:638px;margin:auto;border-radius:46px;border:1px solid #45d7ff35;background:linear-gradient(180deg,#0e163cf7,#070c22f7);backdrop-filter:blur(18px);display:grid;grid-template-columns:repeat(4,1fr);align-items:center;box-shadow:0 14px 45px #0009,0 0 30px #7b5cff10}
.navItem{height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#66939d;font-size:11px;font-weight:900;letter-spacing:1px;border-radius:36px;cursor:pointer}
.navIcon{font-size:29px;margin-bottom:7px}
.navItem.active{color:#64e8ff;background:linear-gradient(145deg,#45d7ff14,#7b5cff18);box-shadow:inset 0 0 22px #45d7ff10,0 0 18px #7b5cff12}

@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes spinr{from{transform:rotate(360deg)}to{transform:rotate(0)}}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 18px #64e8ff,0 0 55px #00dfff66}50%{transform:scale(1.035);box-shadow:0 0 28px #64e8ff,0 0 70px #00dfff88}}
@keyframes resultIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

========================================= */

document.getElementById("loadingScreen");

document.getElementById("app");

const bar =
document.getElementById("progressBar");

document.getElementById("percent");

const loadingStatus =
document.getElementById("loadingStatus");

"Initializing secure interface...",
"Connecting AI engine...",
"Synchronizing game server...",
"Loading live database...",
"Preparing dashboard...",
"System ready..."
];

const start = performance.now();

function loadingLoop(now){

let p = Math.min(
100,
Math.floor(((now - start) / 3000) * 100)
);

bar.style.width = p + "%";

percent.textContent = p + "%";

loadingStatus.textContent =
msgs[Math.min(
msgs.length - 1,
Math.floor(p / 18)
)];

if(p < 100){

requestAnimationFrame(loadingLoop);

}else{

setTimeout(() => {

loadingScreen.classList.add("hide");

app.style.display = "block";

},150);

}

}

requestAnimationFrame(loadingLoop);


/* =========================================
   HISTORY
========================================= */

let currentPeriod = "";
let seconds = 60;

function pick(obj, keys){

for(const key of keys){

if(
obj &&
obj[key] !== undefined &&
obj[key] !== null &&
obj[key] !== ""
){

return obj[key];

}

}

return "";

}


function getList(json){

return (
json?.data?.list ||
json?.data?.records ||
json?.list ||
json?.records ||
[]
);

}


async function loadResults(){

const box =
document.getElementById("resultList");

try{

const response =
await fetch(API_URL,{
cache:"no-store"
});

if(!response.ok){

throw new Error("History request failed");

}

const json =
await response.json();

const list =
getList(json);

if(
!Array.isArray(list) ||
!list.length
){

throw new Error("No history");

}

renderResults(list);

updatePeriod(list);

updatePattern(list);

}
catch(error){

box.innerHTML = `
<div class="resultError">
Live result connection unavailable.<br>
Please refresh or check the server.
</div>
`;

}

}


/* =========================================
   NUMBER IMAGES
========================================= */

function renderResults(list){

const imgs = {

0:"https://dynamic-indigo-glkg7p1j.edgeone.dev/0.png",

1:"https://dynamic-indigo-glkg7p1j.edgeone.dev/1.png",

2:"https://dynamic-indigo-glkg7p1j.edgeone.dev/2.png",

4:"https://dynamic-indigo-glkg7p1j.edgeone.dev/4.png",

8:"https://dynamic-indigo-glkg7p1j.edgeone.dev/8.png",

9:"https://dynamic-indigo-glkg7p1j.edgeone.dev/9%20%281%29.png"

};

list.slice(0,20).map((item,index)=>{

const issue =
pick(item,[
"issueNumber",
"issue",
"period",
"issueNo"
]);

const number =
Number(
pick(item,[
"number",
"openNumber",
"result",
"resultNumber",
"winNumber"
])
);

const valid =
Number.isInteger(number) &&
number >= 0 &&
number <= 9;


/* 0-4 SMALL / 5-9 BIG */

const size =
valid
? (number >= 5 ? "BIG" : "SMALL")
: "--";


const status =
index % 3 === 2
? "LOSS"
: "WIN";


return `

<div class="resultRow">

<div class="resultIssue">

<span style="
display:block;
color:#4f7780;
font-size:8px;
letter-spacing:1px;
margin-bottom:4px
">
PERIOD
</span>

${issue || "Round " + (index + 1)}

</div>


<div class="resultNumber">

${
valid
?
`
<img
src="${imgs[number]}"
alt="${number}"
onerror="
this.style.display='none';
this.parentElement.innerHTML='<span class=resultNumberFallback>${number}</span>'
"
>
`
:
`
<span class="resultNumberFallback">
--
</span>
`
}

</div>


<div class="
resultSize
${size === "BIG" ? "resultBig" : "resultSmall"}
">

${size}

</div>


<div class="
resultStatus
${status === "LOSS" ? "loss" : ""}
">

${status}

</div>

</div>

`;

}).join("");

}


/* =========================================
   PERIOD
========================================= */

function updatePeriod(list){

const raw =
pick(
list[0] || {},
[
"issueNumber",
"issue",
"period",
"issueNo"
]
);

const digits =
String(raw || "").replace(/\D/g,"");

if(digits.length >= 10){

try{

currentPeriod =
(BigInt(digits) + 1n).toString();

}
catch(error){

currentPeriod = digits;

}

}
else if(!currentPeriod){

currentPeriod =
String(raw || "");

}

document.getElementById("period")
.textContent =
currentPeriod || "SYNCING...";

}


/* =========================================
   PATTERN
========================================= */

function updatePattern(list){

const values =
list
.slice(0,10)
.map(item =>
Number(
pick(item,[
"number",
"openNumber",
"result",
"resultNumber",
"winNumber"
])
)
)
.filter(Number.isFinite);


if(!values.length)return;


const big =
values.filter(n => n >= 5).length;

const bigPct =
Math.round(
big / values.length * 100
);

const smallPct =
100 - bigPct;


document.getElementById("patternValue")
.textContent =
`BIG ${bigPct}% | SMALL ${smallPct}%`;


document.getElementById("patternFill")
.style.background =
`linear-gradient(
90deg,
#ffd75a 0 ${bigPct}%,
#64e8ff ${bigPct}%
)`;


document.getElementById("patternFill")
.style.width = "100%";

}


/* =========================================
   COPY PERIOD
========================================= */

document.getElementById("copyBtn").onclick =
async () => {

if(!currentPeriod)return;

try{

await navigator.clipboard.writeText(
currentPeriod
);

const button =
document.getElementById("copyBtn");

button.textContent = "✓ Copied";

setTimeout(
() =>
button.textContent =
"▣  Copy Period",
1200
);

}
catch(error){}

};


/* =========================================
   COUNTDOWN
========================================= */

function syncCountdown(){

const currentSecond =
new Date().getSeconds();

seconds =
currentSecond === 0
? 60
: 60 - currentSecond;


document.getElementById("timerText")
.textContent =
"00:" +
String(seconds).padStart(2,"0");

}


/* =========================================
   DEMO TOP VALUES
========================================= */

function randomInt(a,b){

return Math.floor(
Math.random() * (b-a+1)
) + a;

}

function updateLiveDemoValues(){

document.getElementById("liveUid")
.textContent =
randomInt(10000,1000000)
.toLocaleString("en-IN");

document.getElementById("liveWin")
.textContent =
randomInt(20000,1000000)
.toLocaleString("en-IN");

}


syncCountdown();

updateLiveDemoValues();

loadResults();


setInterval(() => {

syncCountdown();

if(seconds === 60){

loadResults();

}

},1000);


setInterval(
updateLiveDemoValues,
2500
);

setInterval(
loadResults,
15000
);
<script>

/* =========================================
   UID / ACCESS SYSTEM
========================================= */

const unlockOverlay =
document.getElementById("unlockOverlay");

const uidInput =
document.getElementById("uidInput");

const unlockMessage =
document.getElementById("unlockMessage");

const uidDemoResult =
document.getElementById("uidDemoResult");

const demoUidValue =
document.getElementById("demoUidValue");

const requestStatus =
document.getElementById("requestStatus");

const uidSuccess =
document.getElementById("uidSuccess");

const activeUidText =
document.getElementById("activeUidText");

const predictionActive =
document.getElementById("predictionActive");

const predictionNumber =
document.getElementById("predictionNumber");

const predictionMeta =
document.getElementById("predictionMeta");

const lockCard =
document.querySelector(".lockCard");

const unlockBtn =
document.getElementById("unlockBtn");


/* =========================================
   DEVICE ID
========================================= */

const DEVICE_KEY =
"ambika_panel_device_v3";

const UID_KEY =
"ambika_panel_uid_v3";

const ADMIN_TOKEN_KEY =
"ambika_panel_admin_token_v3";


function getDeviceId(){

let id =
localStorage.getItem(DEVICE_KEY);

if(!id){

id =
window.crypto &&
crypto.randomUUID
?
crypto.randomUUID()
:
Date.now() +
"-" +
Math.random()
.toString(36)
.slice(2);

localStorage.setItem(
DEVICE_KEY,
id
);

}

return id;

}


const deviceId =
getDeviceId();


/* =========================================
   SAVED UID
========================================= */

function getSavedUID(){

return (
localStorage.getItem(UID_KEY) || ""
);

}


function saveUID(uid){

localStorage.setItem(
UID_KEY,
uid
);

}


/* =========================================
   OPEN UID MODAL
========================================= */

function playFirstVoice(){

try{

firstVoice.pause();

firstVoice.currentTime = 0;

firstVoice.play().catch(()=>{});

}
catch(error){}

}


function playSecondVoice(){

try{

secondVoice.pause();

secondVoice.currentTime = 0;

secondVoice.play().catch(()=>{});

}
catch(error){}

}


function openUnlock(){

unlockOverlay.classList.add("show");

unlockMessage.textContent = "";

uidDemoResult.classList.remove("show");

setTimeout(
() => uidInput.focus(),
120
);

}


unlockBtn.onclick = () => {

openUnlock();

playFirstVoice();

};


document.getElementById("modalClose").onclick =
() => {

unlockOverlay.classList.remove("show");

};


unlockOverlay.onclick =
event => {

if(event.target === unlockOverlay){

unlockOverlay.classList.remove("show");

}

};


/* =========================================
   UID INPUT
========================================= */

uidInput.oninput = () => {

uidInput.value =
uidInput.value
.replace(/\D/g,"")
.slice(0,8);

};


uidInput.onkeydown = event => {

if(event.key === "Enter"){

document
.getElementById("verifyBtn")
.click();

}

};


/* =========================================
   MESSAGE
========================================= */

function setMessage(text,type="normal"){

unlockMessage.textContent = text;

if(type === "success"){

unlockMessage.style.color =
"#57f2b0";

}
else if(type === "error"){

unlockMessage.style.color =
"#ff4f9a";

}
else{

unlockMessage.style.color =
"#ffd75a";

}

}


/* =========================================
   PREDICTION
========================================= */

/*
   DEMO RANDOM PREDICTION

   0–4 = SMALL
   5–9 = BIG
*/

let predictionTimer = null;

let currentActiveUID = "";


function generatePrediction(){

const number =
Math.floor(
Math.random() * 10
);

const size =
number >= 5
? "BIG"
: "SMALL";

predictionNumber.textContent =
number;

predictionMeta.textContent =
`UID ${currentActiveUID} active • ${size} • DEMO / RANDOM ONLY`;

}


/* Every minute new demo prediction */

function startPrediction(){

clearInterval(predictionTimer);

generatePrediction();

predictionTimer =
setInterval(
generatePrediction,
60000
);

}


function stopPrediction(){

clearInterval(
predictionTimer
);

predictionTimer = null;

}


/* =========================================
   SHOW ACTIVE UID
========================================= */

function showActiveUID(uid,expiresAt){

currentActiveUID = uid;

saveUID(uid);

uidSuccess.classList.add("show");

activeUidText.textContent =
"UID: " + uid;

lockCard.classList.add("uidActive");

unlockBtn.style.display = "none";

predictionActive.classList.add("show");

startPrediction();

if(expiresAt){

const remaining =
Math.max(
0,
expiresAt - Date.now()
);

const hours =
Math.max(
1,
Math.ceil(
remaining / 3600000
)
);

predictionMeta.textContent =
`UID ${uid} active • ${hours} hour(s) remaining`;

}

}


/* =========================================
   RESET ACTIVE UI
========================================= */

function resetActiveUID(){

currentActiveUID = "";

uidSuccess.classList.remove("show");

predictionActive.classList.remove("show");

lockCard.classList.remove("uidActive");

unlockBtn.style.display = "block";

stopPrediction();

}


/* =========================================
   CHECK ACCESS FROM SERVER
========================================= */

async function checkUIDStatus(uid,showModal=false){

if(!uid)return null;

try{

const response =
await fetch(
"/api/access/check",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
uid:uid,
deviceId:deviceId
})
}
);

const data =
await response.json();


if(data.success &&
data.status === "active"){

showActiveUID(
data.uid || uid,
data.expiresAt
);

if(showModal){

uidDemoResult.classList.remove("show");

setMessage(
"✓ UID SUCCESSFULLY ACTIVATED",
"success"
);

setTimeout(
() =>
unlockOverlay.classList.remove("show"),
900
);

}

return data;

}


/* UID waiting for admin */

if(
data.status === "not_active"
){

if(showModal){

setMessage(
"UID is waiting for admin activation.",
"normal"
);

}

return data;

}


/* UID belongs to another device */

if(
data.status === "bound"
){

if(showModal){

setMessage(
"This UID is already active on another device.",
"error"
);

}

return data;

}


}
catch(error){

if(showModal){

setMessage(
"Server connection unavailable. Try again.",
"error"
);

}

}

return null;

}


/* =========================================
   SEND UID REQUEST
========================================= */

async function requestUID(uid){

try{

const response =
await fetch(
"/api/access/request",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
uid:uid,
deviceId:deviceId
})
}
);

const data =
await response.json();


if(
data.status === "active" &&
data.success
){

showActiveUID(
data.uid || uid,
data.expiresAt
);

return data;

}


if(
data.status === "pending"
){

demoUidValue.textContent =
uid;

uidDemoResult.classList.add("show");

requestStatus.textContent =
"⏳ WAITING FOR ADMIN APPROVAL...";

setMessage(
"✓ Request sent to admin.",
"success"
);

playSecondVoice();

return data;

}


if(
data.status === "bound"
){

setMessage(
"This UID is already active on another device.",
"error"
);

return data;

}


setMessage(
data.message ||
"UID request could not be sent.",
"error"
);

return data;

}
catch(error){

setMessage(
"Server connection unavailable.",
"error"
);

return null;

}

}


/* =========================================
   VERIFY BUTTON
========================================= */

document.getElementById("verifyBtn").onclick =
async () => {

const uid =
uidInput.value.trim();


if(!/^\d{5,8}$/.test(uid)){

uidDemoResult.classList.remove("show");

setMessage(
"Please enter a valid 5–8 digit Game UID.",
"error"
);

return;

}


saveUID(uid);

setMessage(
"Checking UID...",
"normal"
);


/* First check whether already activated */

const result =
await checkUIDStatus(
uid,
true
);


if(
result &&
result.success &&
result.status === "active"
){

return;

}


/* Otherwise create pending request */

await requestUID(uid);

};

async function restoreSavedUID(){

getSavedUID();

if(!uid)return;

uidInput.value = uid;

const result =
await checkUIDStatus(
uid,
false
);

if(
result &&
result.success &&
result.status === "active"
){

return;

}

}


/* =========================================
   AUTO CHECK ACTIVE UID
========================================= */

setInterval(
async () => {

const uid =
currentActiveUID ||
getSavedUID();

if(!uid)return;

const result =
await checkUIDStatus(
uid,
false
);


/* If admin locks/expiry happens */

if(
!result ||
!result.success ||
result.status !== "active"
){

if(currentActiveUID){

resetActiveUID();

}

}

},
30000
);


/* =========================================
   AUTO CHECK PENDING REQUEST
========================================= */

setInterval(
async () => {

const uid =
getSavedUID();

if(!uid)return;

if(currentActiveUID)return;

const result =
await checkUIDStatus(
uid,
false
);

if(
result &&
result.success &&
result.status === "active"
){

uidInput.value = uid;

}

},
10000
);


/* =========================================
   REGISTER
========================================= */

document.getElementById("registerBtn").onclick =
() => {

window.location.href =
REGISTER_URL;

};


document.getElementById("telegramBtn").onclick =
() => {

window.location.href =
REGISTER_URL;

/* =========================================
   RESTORE ON LOAD
========================================= */

window.addEventListener(
"load",
() => {

setTimeout(
restoreSavedUID,
1200
);

});


/* =========================================
   VISIBILITY
========================================= */

document.addEventListener(
"visibilitychange",
() => {

if(
document.visibilityState === "visible"
){

const uid =
currentActiveUID ||
getSavedUID();

if(uid){

checkUIDStatus(
uid,
false
);

}

}

});

const requestsResponse =
await fetch(
"/api/admin/requests",
{
headers:adminHeaders()
}
);


if(
requestsResponse.status === 401
){

setAdminToken("");

adminLoginBox.style.display =
"grid";

adminControls.style.display =
"none";

return;

}


const requestsData =
await requestsResponse.json();


const uidResponse =
await fetch(
"/api/admin/uids",
{
headers:adminHeaders()
}
);


const uidData =
await uidResponse.json();


renderAdminPanel(
requestsData.requests || [],
uidData.uids || []
);


}
catch(error){

adminList.innerHTML = `
<div class="adminInfo">
Unable to load UID requests.
</div>
`;

}

}


/* =========================================
   RENDER ADMIN PANEL
========================================= */

function renderAdminPanel(
pending,
active
){

let html = "";


/* -----------------------------------------
   PENDING REQUESTS
----------------------------------------- */

if(pending.length){

html += `
<div style="
color:#ffd75a;
font-size:12px;
font-weight:1000;
margin-bottom:8px;
letter-spacing:1px;
">
⏳ PENDING UID REQUESTS
</div>
`;


pending.forEach(request => {

html += `

<div class="adminItem">

<div class="adminItemTop">

<span>
UID #${escapeHTML(request.uid)}
</span>

<span style="
color:#ffd75a;
">
PENDING
</span>

</div>

<div class="adminItemSub">

Requested:
${formatDate(request.requestedAt)}

<br>

Device:
${escapeHTML(
String(request.deviceId || "")
.slice(0,16)
)}…

</div>

<div class="adminItemActions">

<button
data-approve="${escapeHTML(request.uid)}"
>
✓ ACTIVATE
</button>

<button
data-reject="${escapeHTML(request.uid)}"
style="
color:#ff4f9a;
border-color:#ff4f9a44;
"
>
IGNORE
</button>

</div>

</div>

`;

});

}else{

html += `
<div class="adminInfo">
No pending UID requests.
</div>
`;

}


/* -----------------------------------------
   ACTIVE UIDS
----------------------------------------- */

html += `
<div style="
color:#57f2b0;
font-size:12px;
font-weight:1000;
margin:18px 0 8px;
letter-spacing:1px;
">
✓ ACTIVE UID ACCESS
</div>
`;


if(active.length){

active.forEach(item => {

const remaining =
Math.max(
0,
item.expiresAt - Date.now()
);

const hours =
Math.max(
1,
Math.ceil(
remaining / 3600000
)
);


html += `

<div class="adminItem">

<div class="adminItemTop">

<span>
UID #${escapeHTML(item.uid)}
</span>

<span class="accessActive">
ACTIVE
</span>

</div>

<div class="adminItemSub">

Device:
${
item.deviceId
?
escapeHTML(
String(item.deviceId).slice(0,16)
) + "…"
:
"Not bound"
}

<br>

Expires:
${formatDate(item.expiresAt)}

<br>

Remaining:
about ${hours} hour(s)

</div>

<div class="adminItemActions">

<button
data-lock="${escapeHTML(item.uid)}"
style="
color:#ff4f9a;
border-color:#ff4f9a44;
"
>
LOCK NOW
</button>

</div>

</div>

`;

});

}else{

html += `
<div class="adminInfo">
No active UID access.
</div>
`;

}


adminList.innerHTML = html;


/* =========================================
   ACTIVATE REQUEST
========================================= */

adminList
.querySelectorAll("[data-approve]")
.forEach(button => {

button.onclick = async () => {

const uid =
button.dataset.approve;

const duration =
Number(
document.getElementById(
"adminDuration"
).value
);

button.disabled = true;

button.textContent =
"ACTIVATING...";


try{

const response =
await fetch(
"/api/admin/activate",
{
method:"POST",
headers:adminHeaders(),
body:JSON.stringify({
uid:uid,
hours:duration
})
}
);


const data =
await response.json();


if(data.success){

await loadAdminData();

showAdminToast(
`UID ${uid} activated`
);

}else{

alert(
data.message ||
"Activation failed."
);

button.disabled = false;

button.textContent =
"✓ ACTIVATE";

}

}
catch(error){

alert(
"Server connection unavailable."
);

button.disabled = false;

button.textContent =
"✓ ACTIVATE";

}

};

});


/* =========================================
   IGNORE REQUEST
========================================= */

adminList
.querySelectorAll("[data-reject]")
.forEach(button => {

button.onclick = async () => {

const uid =
button.dataset.reject;


if(
!confirm(
`Ignore UID ${uid} request?`
)
){

return;

}


button.disabled = true;

button.textContent =
"IGNORING...";


try{

const response =
await fetch(
"/api/admin/requests/reject",
{
method:"POST",
headers:adminHeaders(),
body:JSON.stringify({
uid:uid
})
}
);


const data =
await response.json();


if(data.success){

await loadAdminData();

showAdminToast(
`UID ${uid} ignored`
);

}else{

alert(
data.message ||
"Could not ignore request."
);

}

}
catch(error){

alert(
"Server connection unavailable."
);

}

};

});


/* =========================================
   LOCK ACTIVE UID
========================================= */

adminList
.querySelectorAll("[data-lock]")
.forEach(button => {

button.onclick = async () => {

const uid =
button.dataset.lock;


if(
!confirm(
`Lock UID ${uid}?`
)
){

return;

}


button.disabled = true;

button.textContent =
"LOCKING...";


try{

const response =
await fetch(
"/api/admin/lock",
{
method:"POST",
headers:adminHeaders(),
body:JSON.stringify({
uid:uid
})
}
);


const data =
await response.json();


if(data.success){

if(
currentActiveUID === uid
){

resetActiveUID();

}

await loadAdminData();

showAdminToast(
`UID ${uid} locked`
);

}else{

alert(
data.message ||
"Lock failed."
);

}

}
catch(error){

alert(
"Server connection unavailable."
);

}

};

});

}


/* =========================================
   HELPERS
========================================= */

function escapeHTML(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function formatDate(timestamp){

if(!timestamp)return "--";

try{

return new Date(timestamp)
.toLocaleString();

}
catch(error){

return "--";

}

}


function showAdminToast(message){

let toast =
document.getElementById(
"adminToast"
);

if(!toast){

toast =
document.createElement("div");

toast.id =
"adminToast";

toast.style.cssText = `
position:fixed;
left:50%;
top:20px;
transform:translateX(-50%);
z-index:13000;
padding:11px 17px;
border-radius:14px;
background:#0d1638;
border:1px solid #45d7ff55;
color:#64e8ff;
font-size:11px;
font-weight:1000;
box-shadow:0 10px 35px #0009;
`;

document.body.appendChild(toast);

}

toast.textContent =
message;

clearTimeout(
window.__adminToastTimer
);

toast.style.display =
"block";

window.__adminToastTimer =
setTimeout(
() => {
toast.style.display =
"none";
},
1800
);

}


/* =========================================
   ADMIN AUTO REFRESH
========================================= */

setInterval(
() => {

if(
adminControls.style.display !==
"none" &&
getAdminToken()
){

loadAdminData();

}

},
10000
);


/* =========================================
   ADMIN PASSWORD ENTER
========================================= */

adminPassword.onkeydown =
event => {

if(event.key === "Enter"){

document
.getElementById("adminLoginBtn")
.click();

}

};


/* =========================================
   ACTIVE UID RESTORE
========================================= */

setTimeout(
restoreSavedUID,
1000
);


/* =========================================
   REGISTER / SUPPORT
========================================= */

document.getElementById("registerBtn").onclick =
() => {

window.location.href =
REGISTER_URL;

};


document.getElementById("telegramBtn").onclick =
() => {

window.location.href =
REGISTER_URL;

};

</script>
<script>

/* =========================================
   BOTTOM NAVIGATION
========================================= */

const navItems =
document.querySelectorAll(".navItem");

navItems.forEach(item => {

item.addEventListener(
"click",
() => {

navItems.forEach(x =>
x.classList.remove("active")
);

item.classList.add("active");

const target =
item.dataset.target;

if(target){

const section =
document.getElementById(target);

if(section){

section.scrollIntoView({
behavior:"smooth",
block:"start"
});

}

}

});

});


/* =========================================
   SOUND BUTTON
========================================= */

const soundBtn =
document.getElementById("soundBtn");

let soundEnabled =
true;


if(soundBtn){

soundBtn.onclick = () => {

soundEnabled =
!soundEnabled;

soundBtn.textContent =
soundEnabled
? "🔊"
: "🔇";

showToast(
soundEnabled
? "Sound enabled"
: "Sound muted"
);

};

}


/* =========================================
   SAFE TOAST
========================================= */

function showToast(message){

let toast =
document.getElementById(
"mainToast"
);

if(!toast){

toast =
document.createElement("div");

toast.id =
"mainToast";

toast.style.cssText = `
position:fixed;
left:50%;
bottom:85px;
transform:translateX(-50%);
z-index:12000;
padding:10px 16px;
border-radius:14px;
background:rgba(8,15,35,.96);
border:1px solid rgba(73,220,255,.35);
color:#dffaff;
font-size:11px;
font-weight:900;
letter-spacing:.3px;
box-shadow:0 12px 35px rgba(0,0,0,.5);
backdrop-filter:blur(10px);
`;

document.body.appendChild(toast);

}

toast.textContent =
message;

toast.style.display =
"block";

clearTimeout(
window.__mainToastTimer
);

window.__mainToastTimer =
setTimeout(
() => {

toast.style.display =
"none";

},
1800
);

}


/* =========================================
   VISIBILITY / TAB RECOVERY
========================================= */

document.addEventListener(
"visibilitychange",
() => {

if(
document.visibilityState ===
"visible"
){

loadHistory();

if(
typeof checkCurrentAccess ===
"function"
){

checkCurrentAccess();

}

}

});


/* =========================================
   PAGE LOAD
========================================= */

window.addEventListener(
"load",
() => {

setTimeout(
() => {

const loader =
document.getElementById(
"loadingScreen"
);

const app =
document.getElementById(
"app"
);


if(loader){

loader.classList.add("hide");

setTimeout(
() => {

loader.style.display =
"none";

},
450
);

}


if(app){

app.style.display =
"block";

app.style.visibility =
"visible";

app.style.opacity =
"1";

}


/* Initial API load */

if(
typeof loadHistory ===
"function"
){

loadHistory();

}


/* Restore UID */

if(
typeof restoreSavedUID ===
"function"
){

restoreSavedUID();

}

},
3200
);

});


/* =========================================
   LOADER SAFETY FALLBACK
========================================= */

setTimeout(
() => {

const loader =
document.getElementById(
"loadingScreen"
);

const app =
document.getElementById("app");


if(loader){

loader.classList.add("hide");

loader.style.display =
"none";

}


if(app){

app.style.display =
"block";

app.style.visibility =
"visible";

app.style.opacity =
"1";

}

},
5000
);


/* =========================================
   PREVENT EMPTY PAGE
========================================= */

setTimeout(
() => {

const app =
document.getElementById("app");

if(
app &&
getComputedStyle(app).display ===
"none"
){

app.style.display =
"block";

app.style.visibility =
"visible";

app.style.opacity =
"1";

}

},
6500
);


/* =========================================
   PERIOD DISPLAY SAFETY
========================================= */

setInterval(
() => {

const period =
document.getElementById("period");

if(
period &&
period.textContent.trim() === ""
){

period.textContent =
"SYNCING...";

}

},
3000
);


/* =========================================
   LIVE HISTORY REFRESH
========================================= */

setInterval(
() => {

if(
typeof loadHistory ===
"function"
){

loadHistory();

}

},
15000
);


/* =========================================
   ACCESS CHECK REFRESH
========================================= */

setInterval(
() => {

if(
typeof checkCurrentAccess ===
"function" &&
currentActiveUID
){

checkCurrentAccess();

}

},
20000
);


/* =========================================
   CLOCK / TIMER DISPLAY
========================================= */

setInterval(
() => {

const now =
new Date();

const seconds =
now.getSeconds();

const remaining =
60 - seconds;

const timer =
document.getElementById(
"timer"
);

if(timer){

timer.textContent =
String(remaining)
.padStart(2,"0") + "s";

}

},
1000
);


/* =========================================
   ESC KEY
========================================= */

document.addEventListener(
"keydown",
event => {

if(event.key === "Escape"){

if(adminOverlay){

adminOverlay.classList.remove(
"show"
);

}

}

});


/* =========================================
   GLOBAL ERROR PROTECTION
========================================= */

window.addEventListener(
"error",
event => {

console.warn(
"Frontend error:",
event.message
);

});


window.addEventListener(
"unhandledrejection",
event => {

console.warn(
"Unhandled promise:",
event.reason
);

});


/* =========================================
   FINAL UI INIT
========================================= */

document.addEventListener(
"DOMContentLoaded",
() => {

const app =
document.getElementById("app");

if(app){

app.style.visibility =
"visible";

}

});


</script>


</body>
</html>
